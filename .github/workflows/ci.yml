name: Agrograte CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Stage 1 - Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || echo "Vulnerabilities found - review npm audit output"

  typecheck:
    name: Stage 1b - TypeScript Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

  test:
    name: Stage 2 - Unit Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run tests
        run: cargo test

  integration:
    name: Stage 3 - Integration Tests
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrograte
          POSTGRES_USER: agrograte
          POSTGRES_PASSWORD: agrograte
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
      nats:
        image: nats:2
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run integration tests
        run: cargo test -- --ignored
        env:
          DATABASE_URL: postgres://agrograte:agrograte@localhost:5432/agrograte
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222

  security:
    name: Stage 4 - Security Scan
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  loopcheck:
    name: Stage 4b - Loopcheck Gate
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Loopcheck Engine
        run: bash scripts/loopcheck.sh

  build:
    name: Stage 5 - Build
    needs: loopcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  sign:
    name: Stage 6 - Sign Containers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign backend image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Sign frontend image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  deploy-dev:
    name: Stage 7 - Deploy Dev
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Dev via ArgoCD
        run: |
          echo "Triggering ArgoCD sync for dev environment"

  smoke-test:
    name: Stage 8 - Smoke Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          curl -f http://dev.agrograte.ai/api/health || echo "Health check endpoint not yet available"

  deploy-staging:
    name: Stage 9 - Deploy Staging
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging via ArgoCD
        run: |
          echo "Triggering ArgoCD sync for staging environment"

  e2e:
    name: Stage 10 - E2E Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Playwright tests
        uses: microsoft/playwright-github-action@v1
        with:
          working-directory: frontend

  prod-approval:
    name: Stage 11 - Production Approval
    needs: e2e
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval gate
        run: echo "Waiting for manual approval"

  deploy-prod:
    name: Stage 12 - Production Deployment
    needs: prod-approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production via ArgoCD"
